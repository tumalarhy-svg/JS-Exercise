<!DOCTYPE html>
<html>
<head>
    <title>JS Exercise 2</title>

    <style>
        .label {
            display: inline-block;
            width: 100px;
        }
    </style>
</head>

<body>

    <h1>JS Exercise 2</h1>

    <label class="label">First Name:</label>
    <input type="text" id="firstName">
    <br>

    <label class="label">Middle Name:</label>
    <input type="text" id="middleName">
    <br>

    <label class="label">Last Name:</label>
    <input type="text" id="lastName">
    <br>

    <label class="label"></label>
    <button onclick="generateFullname()">Generate Fullname</button>
    <button onclick="clearEntries()">Clear Entries</button>

    <p>
        Full Name:<br>
        <b id="fullName"></b>
    </p>


    <script>

        function generateFullname() {

            let first = document.getElementById("firstName").value;
            let middle = document.getElementById("middleName").value;
            let last = document.getElementById("lastName").value;

            let fullname = first + " " + middle + " " + last;

            document.getElementById("fullName").innerHTML = fullname;
        }


        function clearEntries() {

            document.getElementById("firstName").value = "";
            document.getElementById("middleName").value = "";
            document.getElementById("lastName").value = "";

            document.getElementById("fullName").innerHTML = "";
        }

    </script>

</body>
</html>
